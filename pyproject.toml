[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage"
version = "0.1.0"
description = "Live claude.ai usage dashboard for the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
cookies = ["browser-cookie3>=0.19"]
dev = ["pytest>=7"]

# The script is a single hyphenated file (claude-usage.py) at the repo root and
# is not yet importable-by-name; there is intentionally no [project.scripts]
# entry point until Phase 2. `pip install -e .` still installs the deps.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
