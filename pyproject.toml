[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage"
version = "0.1.0"
description = "Live claude.ai usage dashboard for the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
cookies = ["browser-cookie3>=0.19"]
dev = ["pytest>=7"]

# Single-module package: the runtime lives in claude_usage.py at the repo root.
[project.scripts]
claude-usage = "claude_usage:main"

[tool.setuptools]
py-modules = ["claude_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
